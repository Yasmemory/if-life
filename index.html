<html lang="ja">
<head>

<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#090a0d;--panel:#12141a;--line:#272c38;--muted:#969dac}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -15%,#282031 0,#0d0e12 36%,#090a0d 72%);color:#fff;min-height:100vh}
button{font:inherit}
.wrap{max-width:920px;margin:auto;padding:20px 18px 48px}
.hidden{display:none!important}
.hero{text-align:center;padding:42px 0 18px}
.beta{display:inline-block;margin-bottom:15px;padding:5px 10px;border-radius:999px;border:1px solid #363b48;color:#aab1bf;font-size:.72rem;font-weight:800;letter-spacing:.08em}
.brand{font-size:clamp(48px,10vw,88px);font-weight:950;letter-spacing:-.07em;line-height:.9}
.sub{color:#b0b6c2;margin-top:14px;font-weight:700}
.challenge{margin:24px auto 0;max-width:650px;background:linear-gradient(135deg,rgba(121,28,42,.24),rgba(74,30,89,.18));border:1px solid #64313c;border-radius:20px;padding:17px 18px;text-align:left}
.challenge strong{font-size:1.15rem}
.challenge small{display:block;color:#c7bcc1;margin-top:5px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat,.card,.panel{background:rgba(18,20,26,.94);border:1px solid var(--line);border-radius:18px}
.stat{padding:17px}
.stat small{color:var(--muted)}
.stat b{display:block;font-size:1.45rem;margin-top:5px}
.howto{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;color:#8e95a5;font-size:.84rem;margin:8px 0 18px}
.howto span{padding:7px 10px;background:#111319;border:1px solid #232832;border-radius:999px}
.record{text-align:center;color:#9da4b2;font-size:.9rem;margin-bottom:18px;min-height:20px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{position:relative;overflow:hidden;cursor:pointer;text-align:left;border:1px solid #2d3342;background:#14171e;color:#fff;border-radius:20px;padding:20px;min-height:182px;transition:.16s transform,.16s background,.16s border-color}
.mode:hover{transform:translateY(-3px);background:#191c24}
.mode:active{transform:scale(.99)}
.mode h3{font-size:1.08rem;margin:0 0 9px}
.mode p{color:#b5bbc8;line-height:1.5;margin:0}
.mode .tag{position:absolute;right:14px;bottom:13px;font-size:.72rem;color:#8b92a2}
.hard{border-color:#742d3a}
.random{border-color:#345675}
.win{border-color:#756124}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 14px}
.back{padding:10px 13px;border-radius:12px;background:#151821;color:#fff;border:1px solid #2c3240;cursor:pointer}
.mode-label{font-weight:850}
.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pill{background:#151821;border:1px solid #292f3b;border-radius:14px;padding:10px 11px;font-size:.82rem;color:#aeb5c5}
.pill b{display:block;color:#fff;font-size:1.05rem;margin-top:2px}
.panel{padding:20px;min-height:275px;display:flex;flex-direction:column;justify-content:center}
.age-label{font-size:.78rem;color:#8991a2;font-weight:800;letter-spacing:.07em}
.event{font-size:clamp(1.3rem,4vw,1.7rem);font-weight:850;line-height:1.45;margin:9px 0 19px;letter-spacing:-.02em}
.choices{display:grid;gap:10px}
.choice{width:100%;text-align:left;padding:16px;border-radius:14px;border:1px solid #343b4a;background:#181c25;color:#fff;cursor:pointer;transition:.13s}
.choice:hover{background:#222733;border-color:#525d73}
.choice:active{transform:scale(.99)}
.choice:disabled{opacity:.45;cursor:default}
.outcome{margin-top:14px;padding:15px 16px;border-radius:14px;font-weight:760;line-height:1.5}
.outcome.good{background:#10271c;border:1px solid #285e40;color:#cbf5da}
.outcome.bad{background:#2b1117;border:1px solid #6f2b3a;color:#ffd0d9}
.outcome.neutral{background:#181b22;border:1px solid #343946;color:#e0e3ea}
.continue{margin-top:11px;width:100%;padding:15px;border:0;border-radius:14px;background:#fff;color:#111;font-weight:900;cursor:pointer}
.log-title{font-size:.78rem;color:#777f90;font-weight:800;margin:18px 0 8px}
.log{display:grid;gap:7px;max-height:240px;overflow:auto}
.log div{padding:10px 12px;background:#0f1116;border:1px solid #1f232d;border-radius:11px;font-size:.87rem;color:#b6bdca}
.result-card{text-align:center;background:linear-gradient(165deg,#151820,#101116);border:1px solid #2b303d;border-radius:22px;padding:26px}
.result-mode{color:#9ca3b4;font-weight:850}
.result-title{font-size:1.02rem;color:#cbd0dc;margin-top:14px}
.big{font-size:clamp(3.6rem,16vw,6.6rem);font-weight:950;letter-spacing:-.07em;line-height:1;margin-top:3px}
.rank{margin:13px auto 0;padding:11px 14px;max-width:450px;border-radius:14px;background:#171a22;border:1px solid #303644;font-weight:900}
.badge{display:inline-block;margin-top:12px;border:1px solid #4a4054;border-radius:999px;padding:8px 13px;color:#e4d9eb;font-weight:850;font-size:.86rem}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:15px}
.summary div{background:#101219;border:1px solid #252a35;border-radius:14px;padding:13px}
.summary small{display:block;color:#858d9d}
.summary b{display:block;margin-top:4px;font-size:1.08rem}
.death{margin-top:15px;padding:13px 14px;border-radius:14px;background:#1d1014;color:#f5c3cd;border:1px solid #54242f;line-height:1.5}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:18px}
.actions button{padding:14px;border-radius:13px;border:0;font-weight:850;cursor:pointer}
.primary{background:#fff;color:#111}
.secondary{background:#181c25;color:#fff;border:1px solid #303746!important}

@media(max-width:700px){
  .wrap{padding:14px 13px 36px}
  .hero{padding-top:28px}
  .stats,.modes{grid-template-columns:1fr}
  .pills{grid-template-columns:repeat(2,1fr);position:sticky;top:0;z-index:5;background:#090a0d;padding:8px 0;margin-bottom:6px}
  .actions{grid-template-columns:1fr}
  .panel{padding:17px}
  .mode{min-height:auto}
}
</style>
</head>

<main class="wrap">
<section id="home">
  <div class="hero">
    <div class="beta">PUBLIC BETA</div>
    <div class="brand">IF LIFE</div>
    <div class="sub">人生は選べても、結果は選べない。</div>

  </div>
  <div style="text-align:center;color:#747c8d;font-size:.75rem;margin-top:-8px;margin-bottom:14px">※ 超絶過酷は100万人生シミュレーションによる実測値</div>

  <div class="howto">
    <span>① モードを選ぶ</span>
    <span>② 出た選択肢を選ぶ</span>
    <span>③ 結果は運任せ</span>
  </div>

  <div class="record" id="record"></div>
  <div class="challenge-ladder" id="challengeLadder"></div>

  <div class="modes">
    <button class="mode hard" onclick="start('hard')">
      <h3>☠ 超絶過酷人生</h3>
      <p>理不尽な世界イベントが次々発生。金も成功も関係ない。何歳まで生き残れるかだけ。</p>
      <span class="tag">最初はこれがおすすめ</span>
    </button>
    <button class="mode random" onclick="start('random')">
      <h3>🎲 完全ランダム人生</h3>
      <p>良いことも悪いことも均等寄り。普通からカオスまで何でもあり。</p>
    </button>
    <button class="mode win" onclick="start('win')">
      <h3>👑 超絶勝ち組人生</h3>
      <p>かなり恵まれた人生。それでも結果までは保証されない。</p>
    </button>
  </div>
</section>

<section id="game" class="hidden">
  <div class="topbar">
    <button class="back" onclick="goHome()">← 終了</button>
    <div class="mode-label" id="modeName"></div>
  </div>

  <div class="pills">
    <div class="pill">年齢<b><span id="age">0</span>歳</b></div>
    <div class="pill" id="moneyPill">資産<b id="money">0円</b></div>
    <div class="pill">残りライフ<b id="life">100</b></div>
  </div>

  <div class="panel">
    <div class="age-label" id="ageLabel"></div>
    <div id="event" class="event"></div>
    <div id="choices" class="choices"></div>
    <div id="outcomeWrap"></div>
  </div>

  <div class="log-title">これまでの人生</div>
  <div id="log" class="log"></div>
</section>

<section id="result" class="hidden">
  <div class="result-card">
    <div class="result-mode" id="resultMode"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="big"><span id="deathAge"></span><small style="font-size:.32em;letter-spacing:0">歳</small></div>
    <div class="rank" id="rare"></div>
    <div id="newRecord" class="new-record"></div>
    <div class="badge" id="badge"></div>

    <div class="summary">
      <div id="moneySummary"><small>最大資産</small><b id="maxMoney"></b></div>
      <div><small>人生イベント</small><b id="eventCount"></b></div>
      <div><small>残りライフ</small><b id="finalLife"></b></div>
      <div><small>今回の挑戦</small><b id="attemptNo"></b></div>
    </div>

    <div class="achievement-list" id="achievementList"></div>
    <div class="death" id="deathReason"></div>

    <div class="actions">
      <button class="primary" onclick="retry()">同じモードでもう一度</button>
      <button class="secondary" onclick="shareResult()">結果を共有</button>
      <button class="secondary" onclick="copyResult()">シェア文をコピー</button>
      <button class="secondary" onclick="goHome()">別の人生を選ぶ</button>
    </div>
  </div>
</section>
</main>

chaosExpansion.forEach(function(e){
  chaos.push([e[0],e[1],e[2]]);
  if(e[2][2]) fatalChaosOutcomes.add(e[2][2]);
  if(e[2][1]) chaosDamage[e[2][1]]=[e[3],e[4]];
});

var HARD_FATAL_RATE = 0.12;
var HARD_DAMAGE_RATE = 0.28;

function chaosCategory(msg){
  if(fatalChaosOutcomes.has(msg)) return "fatal";
  if(chaosDamage[msg]) return "damage";
  return "safe";
}

function chooseHardChaosOutcome(event){
  var pools={safe:[],damage:[],fatal:[]};
  event[2].forEach(function(msg){pools[chaosCategory(msg)].push(msg);});
  var r=Math.random();
  var wanted=r<HARD_FATAL_RATE?"fatal":(r<HARD_FATAL_RATE+HARD_DAMAGE_RATE?"damage":"safe");
  if(pools[wanted].length) return rnd(pools[wanted]);
  if(pools.safe.length) return rnd(pools.safe);
  if(pools.damage.length) return rnd(pools.damage);
  return rnd(pools.fatal);
}

function fmt(n){
  var sign=n<0?"-":"";
  n=Math.abs(n);
  if(n>=100000000)return sign+(n/100000000).toFixed(n>=1000000000?1:2).replace(/\.00$/,"")+"億円";
  if(n>=10000)return sign+Math.round(n/10000).toLocaleString()+"万円";
  return sign+Math.round(n).toLocaleString()+"円";
}

  ["home","game","result"].forEach(function(x){

function tries(){return Number(localStorage.getItem("iflife_tries")||0);}
function bestHard(){return Number(localStorage.getItem("iflife_best_hard")||0);}
var hardMilestones=[
  {age:20,label:"生存者",icon:"🩹"},
  {age:30,label:"しぶとい",icon:"🪖"},
  {age:50,label:"生還者",icon:"🔥"},
  {age:80,label:"ほぼ不死身",icon:"🏆"},
  {age:100,label:"伝説",icon:"👑"}
];

function renderChallengeLadder(){
  var box=document.getElementById("challengeLadder");
  if(!box)return;
  var best=bestHard();
  var next=hardMilestones.find(function(m){return best<m.age;});
  var cards=hardMilestones.map(function(m){
    var done=best>=m.age;
    var current=next&&next.age===m.age;
    return '<div class="milestone '+(done?'done ':'')+(current?'current':'')+'"><b>'+m.age+'歳</b>'+(done?'達成 ✓':m.label)+'</div>';
  }).join("");
  var goal=next?('次の目標：<b>'+next.age+'歳</b>まで生き残る'):'全チャレンジ達成。あなたはもう人間ではない。';
  box.innerHTML='<h3>☠ 超絶過酷 サバイバルチャレンジ</h3><div class="ladder">'+cards+'</div><div class="next-goal">'+goal+'</div>';
}

function unlockedAchievements(age){
  var list=[];
  hardMilestones.forEach(function(m){
    if(age>=m.age)list.push(m.icon+' '+m.age+'歳突破「'+m.label+'」');
  });
  if(age<5)list.push('💀 5歳未満「人生RTA」');
  if(s&&s.count>=10)list.push('🧱 10イベント突破「まだ死なない」');
  if(s&&s.life===0)list.push('❤️‍🔥 ライフ0「力尽きた」');
  return list;
}

  renderChallengeLadder();
  var e=document.getElementById("record");

  var b=bestHard();
  if(!t){
    e.textContent="10秒で始められます。登録・ログイン不要。";
  }else{
    e.textContent="これまで "+t+" 人生をプレイ"+(b?" ／ 超絶過酷ベスト "+b+"歳":"");

}

function start(mode){
  var n=tries()+1;
  localStorage.setItem("iflife_tries",String(n));
  s={
    attempt:n,
    mode:mode,
    age:0,
    money:mode==="win"?8000000:(mode==="hard"?0:Math.floor(Math.random()*1500000)),
    life:100,
    maxMoney:0,
    log:[],
    dead:false,
    count:0,
    locked:false,
    recentEvents:[]
  };
  document.getElementById("modeName").textContent=names[mode];
  document.getElementById("moneyPill").classList.toggle("hard-only-hide",mode==="hard");
  document.getElementById("moneySummary").classList.toggle("hard-only-hide",mode==="hard");
  show("game");
  next();
}

function goHome(){show("home");updateRecord();}
function retry(){if(s)start(s.mode);}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function chance(p){return Math.random()<p;}
function shuffled(a){return a.slice().sort(function(){return Math.random()-.5;});}
function pickEvent(pool){
  if(!s||!pool.length)return rnd(pool);
  var recent=s.recentEvents||[];
  var candidates=pool.filter(function(ev){return recent.indexOf(ev[0])===-1;});
  if(!candidates.length)candidates=pool;
  var ev=rnd(candidates);
  recent.push(ev[0]);
  if(recent.length>12)recent.shift();
  s.recentEvents=recent;
  return ev;
}

function next(){
  if(!s||s.dead)return finish();

  s.locked=false;
  document.getElementById("outcomeWrap").innerHTML="";

  var jump=s.age<5?Math.ceil(Math.random()*2):Math.ceil(Math.random()*5);
  s.age+=jump;

  var deathBase=0;
  if(s.mode==="hard"){
    deathBase=s.age>=60?Math.min(.02+(s.age-60)*.006,.35):0;
  }else if(s.mode==="random"){
    deathBase=s.age>80?.20:(s.age>60?.07:.013);
  }else{
    deathBase=s.age>90?.15:(s.age>70?.035:.004);
  }

  if(chance(deathBase)){
    s.dead=true;
    s.life=0;
    s.reason=s.mode==="hard"?"年齢とこれまでの無茶がついに限界を迎えた":(s.mode==="win"?"珍しい不運が重なり人生を終えた":"寿命または不運により人生を終えた");
    finish();
    return;
  }

  var ev=(s.mode==="hard"&&chance(.92))?pickEvent(chaos):pickEvent(normal);
  s.current=ev;
  s.count++;

  document.getElementById("ageLabel").textContent="AGE "+s.age;
  document.getElementById("event").textContent=ev[0];

  var choices=document.getElementById("choices");
  choices.innerHTML="";

  shuffled(ev[1]).slice(0,Math.min(ev[1].length,Math.random()<.5?2:3)).forEach(function(c){
    var b=document.createElement("button");
    b.className="choice";
    b.textContent=c;
    b.onclick=function(){resolveChoice(c);};
    choices.appendChild(b);
  });

  render();
}

function resolveChoice(c){
  if(s.locked)return;
  s.locked=true;

  document.querySelectorAll(".choice").forEach(function(b){b.disabled=true;});

  var good=s.mode==="hard"?.15:(s.mode==="win"?.76:.47);
  var verybad=s.mode==="hard"?.40:(s.mode==="win"?.04:.15);
  var r=Math.random();
  var msg="";
  var tone="neutral";

  if(s.current.length===3&&s.mode==="hard"&&chaos.indexOf(s.current)!==-1){
    msg=chooseHardChaosOutcome(s.current);
    var cat=chaosCategory(msg);
    tone=cat==="safe"?"good":"bad";

    if(fatalChaosOutcomes.has(msg)){
      s.life=0;
      s.dead=true;
      s.reason=msg;
      msg=msg+" ライフ-100。残りライフは0だ！";
      tone="bad";
    }else if(chaosDamage[msg]){
      var damage=chaosDamage[msg][0];
      var extra=chaosDamage[msg][1];
      s.life=Math.max(0,s.life-damage);
      msg=extra+" 残りライフは"+Math.round(s.life)+"だ！";
      tone="bad";
      if(s.life<=0){
        s.dead=true;
        s.reason=extra;
      }
    }else if(/無傷|戻った|安全|築けた|教えてもらった|達人|助かった/.test(msg)){
      tone="good";
    }
  }else{
    if(s.mode==="hard"){
      if(r<verybad){
        var d=10+Math.floor(Math.random()*41);
        s.life=Math.max(0,s.life-d);
        msg=rnd(["完全に裏目に出た。","最悪のタイミングだった。","運がなさすぎた。"])+" ライフ-"+d+"。残りライフは"+Math.round(s.life)+"だ！";
        tone="bad";
        if(s.life<=0){s.dead=true;s.reason="不運が積み重なって力尽きた";}
      }else if(r<verybad+good){
        msg=rnd(["奇跡的に助かった。","なぜか無事だった。","ギリギリ生き延びた。"]);
        tone="good";
      }else{
        msg=rnd(["なんとか切り抜けた。","特に何も起きなかった。","今回は生き残った。"]);
        tone="neutral";
      }
    }else if(r<verybad){
      var loss=Math.floor(200000+Math.random()*3000000);
      s.money-=loss;
      msg=rnd(["完全に裏目に出た。","想像以上の大失敗になった。","判断が最悪の方向へ転んだ。"])+" 資産 "+fmt(-loss);
      tone="bad";
    }else if(r<verybad+good){
      var gain=Math.floor(300000+Math.random()*(s.mode==="win"?18000000:7000000));
      s.money+=gain;
      msg=rnd(["予想外の大成功になった。","かなりうまくいった。","人生が良い方向へ転がった。"])+" 資産 +"+fmt(gain);
      tone="good";
    }else{
      s.money+=Math.floor((Math.random()-.45)*900000);
      msg=rnd(["特に大きな変化はなかった。","まあまあの結果だった。","思ったほど何も起きなかった。"]);
      tone="neutral";
    }
  }

  s.maxMoney=Math.max(s.maxMoney,s.money);
  s.log.unshift(s.age+"歳　"+c+" → "+msg);

  render();

  var w=document.getElementById("outcomeWrap");
  var label=s.dead?"人生の結果を見る":"次へ進む →";
  w.innerHTML='<div class="outcome '+tone+'">'+msg+'</div><button class="continue" id="continueButton">'+label+'</button>';
  document.getElementById("continueButton").onclick=function(){
    if(s.dead)finish();else next();
  };
}

function render(){
  document.getElementById("age").textContent=s.age;
  document.getElementById("money").textContent=fmt(s.money);
  document.getElementById("life").textContent=Math.round(s.life);
  document.getElementById("log").innerHTML=s.log.slice(0,10).map(function(x){
    return "<div>"+x+"</div>";
  }).join("");
}

function topForAge(a){
  if(!s||s.mode!=="hard")return null;
  if(a>=100)return .0161;
  if(a>=90)return .0781;
  if(a>=80)return .3216;
  if(a>=70)return 1.0406;
  if(a>=50)return 5.4553;
  if(a>=30)return 20.8856;
  if(a>=20)return 37.3302;
  return Math.max(25,100-a*2.5);
}

function titleFor(a){
  if(s.mode==="hard"){
    if(a>=100)return"伝説。過酷人生の方が負けている";
    if(a>=80)return"ほぼ不死身";
    if(a>=50)return"異常な生存力";
    if(a>=30)return"かなり粘った";
    if(a>=20)return"平均寿命を突破";
    if(a<10)return"開始直後に世界が牙をむいた";
    return"超絶過酷らしい結末";
  }
  if(s.mode==="win")return a>=85?"勝ち組人生を最後まで走り切った":"恵まれていても人生は読めない";
  return a>=90?"かなり長い人生だった":"何が起こるか分からない人生だった";
}

function badgeFor(){
  if(s.mode==="hard"&&s.age>=100)return"👑 100歳：LEGEND";
  if(s.mode==="hard"&&s.age>=80)return"🏆 80歳：SURVIVOR LEGEND";
  if(s.mode==="hard"&&s.age>=50)return"🔥 50歳：生還者";
  if(s.mode==="hard"&&s.age>=30)return"🪖 30歳：しぶとい";
  if(s.mode==="hard"&&s.age>=20)return"🩹 20歳：生存者";
  if(s.mode!=="hard"&&s.maxMoney>=1000000000)return"👑 超富豪";
  if(s.age<10)return"💀 スピードラン";
  return"🎲 ONE LIFE";
}

function finish(){
  if(!s)return;

  show("result");

  var oldBest=bestHard();
  var isNew=s.mode==="hard"&&s.age>oldBest;
  if(isNew)localStorage.setItem("iflife_best_hard",String(s.age));

  var top=topForAge(s.age);

  document.getElementById("resultMode").textContent=names[s.mode];
  document.getElementById("resultTitle").textContent=titleFor(s.age);
  document.getElementById("deathAge").textContent=s.age;
  document.getElementById("maxMoney").textContent=fmt(s.maxMoney);
  document.getElementById("eventCount").textContent=s.count+"回";
  document.getElementById("finalLife").textContent=Math.round(s.life);
  document.getElementById("attemptNo").textContent="#"+s.attempt;
  document.getElementById("rare").textContent=top!==null?"生存記録 上位 約 "+top.toFixed(top<1?2:1)+"%":"今回も唯一のランダム人生";
  document.getElementById("newRecord").textContent=isNew?"NEW RECORD：超絶過酷の自己ベスト更新！":"";
  document.getElementById("badge").textContent=badgeFor();
  document.getElementById("deathReason").textContent="最期："+(s.reason||"人生を終えた");
  var ach=document.getElementById("achievementList");
  if(s.mode==="hard"){
    var items=unlockedAchievements(s.age);
    ach.innerHTML=items.length?items.map(function(x){return '<div class="achievement unlocked"><strong>実績解除</strong>'+x+'</div>';}).join(""):'';
  }else{
    ach.innerHTML="";
  }

  updateRecord();
}

function shareText(){
  var top=topForAge(s.age);
  var text=names[s.mode]+"をやったら"+s.age+"歳まで生きた。\n";
  if(s.mode!=="hard")text+="最大資産 "+fmt(s.maxMoney)+"\n";
  if(top!==null)text+="生存上位 約"+top.toFixed(2)+"%\n";
  text+=badgeFor()+"\n";
  text+="人生は選べても、結果は選べない。\n#IFLIFE";
  return text;
}

async function shareResult(){
  var text=shareText();
  if(navigator.share){
    try{
      await navigator.share({title:"IF LIFE",text:text,url:location.href});
      return;
    }catch(e){}
  }
  copyResult();
}

async function copyResult(){
  var t=shareText();
  try{
    await navigator.clipboard.writeText(t);
    alert("シェア文をコピーしました");
  }catch(e){
    prompt("コピーしてください",t);
  }
}

updateRecord();
renderChallengeLadder();
</script>
